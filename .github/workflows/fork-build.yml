name: Fork Build
run-name: Fork build ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' - Manual' || '' }}

on:
    push:
        branches:
            - folders-first
    workflow_dispatch:

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: darwin
                      runner: macos-latest
                    - platform: windows
                      runner: windows-latest
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v6

            - name: Install Zig (Windows only)
              if: matrix.platform == 'windows'
              uses: mlugg/setup-zig@v2

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5

            # NOTE: we deliberately do NOT use `task package`. Its deps run in parallel and
            # `clean` (rm -rf dist) can race with / clobber `build:backend`'s output, producing
            # an installer with no wavesrv binary. The app then launches but never shows a window
            # (wavesrv ENOENT). Build sequentially instead, and fail loudly if wavesrv is missing.
            - name: Build (Darwin)
              if: matrix.platform == 'darwin'
              run: |
                  set -e
                  task build:backend
                  test -f dist/bin/wavesrv.arm64 && test -f dist/bin/wavesrv.x64
                  task build:tsunamiscaffold
                  npm run build:prod
                  test -f dist/bin/wavesrv.arm64 && test -f dist/bin/wavesrv.x64
                  npm exec electron-builder -- -c electron-builder.config.cjs -p never

            - name: Build (Windows)
              if: matrix.platform == 'windows'
              shell: powershell
              run: |
                  task build:backend
                  if (-not (Test-Path dist/bin/wavesrv.x64.exe)) { throw "wavesrv missing after build:backend" }
                  task build:tsunamiscaffold
                  npm run build:prod
                  if (-not (Test-Path dist/bin/wavesrv.x64.exe)) { throw "wavesrv clobbered by build:prod" }
                  npm exec electron-builder -- -c electron-builder.config.cjs -p never

            - name: Upload installers
              uses: actions/upload-artifact@v5
              with:
                  name: wave-${{ matrix.platform }}
                  path: |
                      make/*.exe
                      make/*.msi
                      make/*.dmg
                      make/*.zip
                  retention-days: 30
